<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Тема 2.5. Внешняя политика СССР в 1920–1930-е годы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d2231c; --red-d:#9e1610; --ink:#141414; --paper:#efe5cf; --paper2:#e6d8b8;
  --ochre:#d89a1e; --grey:#5b564c; --ok:#2f6b2a;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'PT Serif',Georgia,'Times New Roman',serif;
  --mono:'PT Mono','Courier New',monospace;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(rgba(20,20,20,.05) 1px,transparent 1.4px),radial-gradient(rgba(160,120,60,.06) 1px,transparent 1.6px);
  background-size:7px 7px,13px 13px;background-position:0 0,3px 5px;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{font-size:16px}
a{color:var(--red-d)}
.wrap{max-width:980px;margin:0 auto;padding:0 calc(18px + var(--safe-r)) 0 calc(18px + var(--safe-l))}

/* ---------- poster header ---------- */
.poster{position:relative;background:var(--ink);color:var(--paper);overflow:hidden;min-height:330px;isolation:isolate}
.poster .wedge{position:absolute;inset:0;background:var(--red);clip-path:polygon(0 0,74% 0,40% 100%,0 100%);z-index:-1}
.poster .rays{position:absolute;right:-120px;top:-120px;width:520px;height:520px;z-index:-1;opacity:.95}
.poster .band{position:absolute;left:-10%;bottom:46px;width:130%;height:22px;background:var(--ochre);transform:rotate(-6deg);z-index:-1}
.poster .inner{position:relative;padding:34px calc(20px + var(--safe-r)) 92px calc(20px + var(--safe-l));max-width:980px;margin:0 auto}
.poster .kicker{font-family:var(--head);letter-spacing:.18em;text-transform:uppercase;font-size:14px;background:var(--ink);display:inline-block;padding:4px 10px}
.poster h1{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:.95;margin:16px 0 10px;font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;max-width:11ch}
.poster h1 span{display:block;color:var(--ink);background:var(--paper);width:max-content;max-width:100%;padding:0 .12em;margin-top:.08em;transform:rotate(-2deg);transform-origin:left}
.poster .sub{font-family:var(--head);font-size:clamp(16px,3.6vw,22px);text-transform:uppercase;letter-spacing:.04em;max-width:30ch}
.poster .years{position:absolute;right:calc(18px + var(--safe-r));bottom:76px;font-family:var(--head);font-weight:700;font-size:clamp(30px,8vw,70px);color:var(--paper);background:var(--ink);padding:0 .15em;line-height:1.1}
@media (max-width:560px){.poster .years{position:static;margin-top:14px;display:block}.poster .inner{padding-bottom:76px}.poster .wedge{clip-path:polygon(0 0,100% 0,30% 100%,0 100%)}.poster .rays{width:300px;height:300px;right:-120px;top:auto;bottom:-40px}}
.poster.compact{min-height:0}.poster.compact .inner{padding-top:16px;padding-bottom:40px}.poster.compact h1{font-size:clamp(26px,6vw,44px);margin:10px 0 0}.poster.compact .kicker,.poster.compact .sub,.poster.compact .years,.poster.compact .rays{display:none}.poster.compact .band{bottom:14px;height:12px}
.sim,.steps{scroll-margin-top:70px}

/* ---------- user bar & nav ---------- */
.userbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);font-family:var(--head);letter-spacing:.04em;font-size:14px;text-transform:uppercase;border-bottom:4px solid var(--red)}
.userbar .wrap{display:flex;gap:10px;align-items:center;min-height:48px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.userbar .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbar button{background:none;border:2px solid var(--paper);color:var(--paper);padding:6px 10px;min-height:38px;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.userbar button.on{background:var(--red);border-color:var(--red)}
.steps{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.steps button{flex:0 0 auto;scroll-snap-align:start;border:3px solid var(--ink);background:var(--paper);padding:8px 12px;min-height:46px;font-family:var(--head);text-transform:uppercase;font-size:14px;letter-spacing:.04em;cursor:pointer;display:flex;gap:8px;align-items:center}
.steps button b{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--ink);color:var(--paper);border-radius:50%;font-size:14px}
.steps button.cur{background:var(--red);color:#fff;border-color:var(--red)}
.steps button.cur b{background:#fff;color:var(--red)}
.steps button.done b{background:var(--ok)}

/* ---------- generic blocks ---------- */
main{padding-bottom:calc(60px + var(--safe-b))}
.h2{font-family:var(--head);text-transform:uppercase;font-weight:700;font-size:clamp(28px,6vw,46px);line-height:1;margin:26px 0 8px;display:flex;align-items:flex-start;gap:12px}
.h2 .n{flex:0 0 auto;background:var(--red);color:#fff;padding:4px 10px 2px;transform:rotate(-4deg);font-size:.8em}
.lead{font-family:var(--head);font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--grey);margin:0 0 18px}
.card{background:#f7f0de;border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:18px 18px 16px;margin:0 0 26px;position:relative}
.card.red{background:var(--red);color:#fff;box-shadow:7px 7px 0 var(--ink)}
.card.red a{color:#fff}
.card h3{font-family:var(--head);text-transform:uppercase;font-size:22px;line-height:1.1;margin:0 0 10px;letter-spacing:.02em}
.card p{margin:0 0 .8em}
.card p:last-child{margin-bottom:0}
.tag{display:inline-block;font-family:var(--head);text-transform:uppercase;font-size:13px;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:2px 8px;margin:0 6px 8px 0}
.tag.r{background:var(--red);color:#fff}
.muted{color:var(--grey);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:17px;padding:10px 18px;min-height:50px;cursor:pointer;box-shadow:4px 4px 0 var(--red);transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.nextbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 30px}
label.f{display:block;font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;font-size:15px;margin:12px 0 6px}
input.t,textarea.t{width:100%;border:3px solid var(--ink);background:#fffaf0;padding:10px 12px;border-radius:0;-webkit-appearance:none;appearance:none}
textarea.t{min-height:110px;resize:vertical;line-height:1.5}
input.t:focus,textarea.t:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(210,35,28,.25)}
.cnt{font-family:var(--mono);font-size:13px;color:var(--grey);text-align:right;margin-top:4px}
.q{margin:16px 0 4px;font-weight:700}

/* ---------- home pair cards ---------- */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0}
@media (max-width:720px){.pairs{grid-template-columns:1fr}}
.pair{border:3px solid var(--ink);background:#f7f0de;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column}
.pair .top{background:var(--ink);color:var(--paper);padding:14px 16px;position:relative;overflow:hidden}
.pair .top::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:var(--red);transform:rotate(30deg)}
.pair .top .num{font-family:var(--head);font-size:56px;line-height:1;font-weight:700;position:relative;z-index:1}
.pair .top .nm{font-family:var(--head);text-transform:uppercase;font-size:21px;line-height:1.1;position:relative;z-index:1;max-width:80%}
.pair .body{padding:14px 16px 18px;flex:1;display:flex;flex-direction:column}
.pair ol{margin:6px 0 16px;padding-left:22px}
.pair ol li{margin:3px 0}
.pair .btn{margin-top:auto;align-self:flex-start}
.status{font-family:var(--head);text-transform:uppercase;font-size:14px;letter-spacing:.05em;margin:0 0 10px}
.status.ok{color:var(--ok)}

/* ---------- sorting ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 18px}
.colhead{font-family:var(--head);text-transform:uppercase;padding:10px 12px;font-size:17px;line-height:1.15;border:3px solid var(--ink)}
.colhead.a{background:var(--red);color:#fff}
.colhead.b{background:var(--ink);color:var(--paper)}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.sortlist{display:grid;gap:12px}
.scard{border:3px solid var(--ink);background:#fffaf0;padding:12px 14px;display:grid;gap:10px}
.scard .yr{font-family:var(--head);font-size:15px;color:var(--red-d);letter-spacing:.05em}
.scard .tx{font-weight:700;line-height:1.35}
.scard .ch{display:flex;gap:8px;flex-wrap:wrap}
.scard .ch button{flex:1 1 140px;min-height:46px;border:3px solid var(--ink);background:var(--paper);font-family:var(--head);text-transform:uppercase;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:6px 8px}
.scard .ch button.sel.a{background:var(--red);border-color:var(--red);color:#fff}
.scard .ch button.sel.b{background:var(--ink);color:var(--paper)}
.scard.right{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.scard.wrong{border-color:var(--red);box-shadow:inset 6px 0 0 var(--red)}
.scard .ex{font-size:15px;color:var(--grey);display:none}
.checked .scard .ex{display:block}
.checked .scard .ch button{pointer-events:none}
.scorebox{font-family:var(--head);font-size:24px;text-transform:uppercase;border:3px solid var(--ink);background:var(--ochre);display:inline-block;padding:6px 14px;margin:8px 0 14px;box-shadow:4px 4px 0 var(--ink)}

/* ---------- documents ---------- */
.doc{background:#fbf6e8;border:2px solid #8b8170;box-shadow:6px 6px 0 rgba(20,20,20,.85);padding:22px 20px 18px;margin:0 0 18px;position:relative;font-family:var(--mono);font-size:15.5px;line-height:1.6;overflow-wrap:break-word}
.doc::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--ink) 22px 44px)}
.doc .dh{font-family:var(--head);text-transform:uppercase;font-size:20px;line-height:1.15;margin:4px 0 4px;letter-spacing:.02em}
.doc .meta{font-family:var(--body);font-style:italic;font-size:15px;color:var(--grey);margin:0 0 12px}
.doc p{margin:0 0 .7em}
.doc .gap{color:var(--grey)}
.stamp{display:inline-block;margin:2px 0 10px;border:3px solid var(--red);color:var(--red);font-family:var(--head);font-size:15px;letter-spacing:.12em;padding:2px 8px;transform:rotate(-3deg);opacity:.9}
.docq{background:var(--paper2);border:3px solid var(--ink);padding:14px 16px;margin:-6px 0 28px}
.docq .q:first-child{margin-top:0}
.ctx{font-family:var(--body);font-size:16px;border-left:6px solid var(--ochre);padding:4px 0 4px 12px;margin:0 0 14px}

/* ---------- dossier ---------- */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 0 24px}
.dgrid.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.dgrid,.dgrid.two{grid-template-columns:1fr}}
.dos{border:3px solid var(--ink);background:#f7f0de;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column}
.dos .dt{background:var(--red);color:#fff;font-family:var(--head);text-transform:uppercase;padding:10px 12px;font-size:20px;line-height:1.1}
.dos .dt small{display:block;font-size:14px;letter-spacing:.06em;opacity:.95;margin-top:3px}
.dos dl{margin:0;padding:10px 12px 14px}
.dos dt{font-family:var(--head);text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--red-d);margin-top:10px}
.dos dt:first-child{margin-top:0}
.dos dd{margin:2px 0 0;font-size:15.5px;line-height:1.45}
.tl{list-style:none;margin:0 0 24px;padding:0;border-left:6px solid var(--ink)}
.tl li{position:relative;padding:4px 0 14px 20px}
.tl li::before{content:"";position:absolute;left:-13px;top:10px;width:20px;height:20px;background:var(--red);border:3px solid var(--ink);transform:rotate(45deg)}
.tl .d{font-family:var(--head);text-transform:uppercase;font-size:16px;letter-spacing:.04em;color:var(--red-d);display:block}

/* ---------- quiz ---------- */
.qz{border:3px solid var(--ink);background:#f7f0de;padding:14px 16px;margin:0 0 16px}
.qz .qt{font-weight:700;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);background:#fffaf0;padding:10px 12px;margin:0 0 8px;cursor:pointer;min-height:46px}
.opt input{margin-top:5px;width:20px;height:20px;accent-color:var(--red);flex:0 0 auto}
.opt.good{border-color:var(--ok);background:#e6efd9}
.opt.bad{border-color:var(--red);background:#f6dcd6}
.qz.locked .opt{cursor:default}

/* ---------- simulation ---------- */
.sim{border:3px solid var(--ink);background:var(--ink);color:var(--paper);box-shadow:8px 8px 0 var(--red);margin:0 0 26px}
.sim .sh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-bottom:3px solid var(--red);font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.sim .sb{padding:16px}
.sim .date{font-family:var(--head);font-size:clamp(28px,7vw,48px);line-height:1;color:var(--red);text-transform:uppercase;margin:0 0 10px}
.sim .sit{margin:0 0 14px}
.sim .ops{display:grid;gap:10px;margin:0 0 12px}
.sim .ops button{text-align:left;border:3px solid var(--paper);background:transparent;color:var(--paper);padding:12px 14px;cursor:pointer;line-height:1.4;min-height:50px;display:flex;gap:12px;align-items:flex-start}
.sim .ops button b{font-family:var(--head);font-size:20px;line-height:1;flex:0 0 auto;color:var(--ochre)}
.sim .ops button.sel{background:var(--red);border-color:var(--red)}
.sim .ops button.real{outline:4px solid var(--ochre);outline-offset:-1px}
.sim textarea.t{background:#262421;color:var(--paper);border-color:var(--paper)}
.sim .fact{background:var(--paper);color:var(--ink);border-left:10px solid var(--red);padding:12px 14px;margin:12px 0 4px}
.sim .fact h4{font-family:var(--head);text-transform:uppercase;margin:0 0 6px;font-size:18px}
.sim .fact p{margin:0 0 .6em}
.sim .fact p:last-child{margin:0}
.prog{height:10px;background:#3a3732;margin:0}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}

/* ---------- misc ---------- */
.pos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 22px}
@media (max-width:760px){.pos{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);border:3px solid var(--red);padding:10px 16px;font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;z-index:50;max-width:calc(100% - 30px);text-align:center;display:none}
.missing{border:3px dashed var(--red);padding:10px 14px;background:#fbe6e1;margin:10px 0}
.missing ul{margin:6px 0 0;padding-left:20px}
footer{border-top:4px solid var(--ink);margin-top:20px;padding:16px 0 calc(24px + var(--safe-b));font-family:var(--head);text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--grey)}
.hide{display:none!important}
@media print{.userbar,.steps,.nextbar,.btn{display:none!important}.card,.doc,.dos{box-shadow:none}}
</style>
</head>
<body>

<header class="poster" id="poster" aria-label="Заголовок">
  <div class="wedge"></div>
  <svg class="rays" viewBox="0 0 520 520" aria-hidden="true">
    <g fill="#141414"><path d="M260 260 L520 120 L520 170Z"/><path d="M260 260 L520 230 L520 280Z"/><path d="M260 260 L520 340 L520 390Z"/><path d="M260 260 L470 520 L420 520Z"/><path d="M260 260 L350 520 L300 520Z"/></g>
    <circle cx="260" cy="260" r="92" fill="#efe5cf"/><circle cx="260" cy="260" r="56" fill="#d2231c"/>
  </svg>
  <div class="band"></div>
  <div class="inner">
    <div class="kicker">Тема 2.5 · История России · две пары</div>
    <h1>От мировой революции<span>к 22 июня</span></h1>

  </div>
</header>

<div class="userbar hide" id="userbar"><div class="wrap">
  <div class="who" id="who"></div>
  <button id="goHome" type="button">Пары</button>

  <button id="goP2" type="button">Пара 2</button>
</div></div>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer class="wrap">Тема 2.5 · Внешняя политика СССР 1920–1941 · Документы приведены по официальным публикациям</footer>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function fmt(ts){if(!ts)return'';var d=new Date(ts);function p(n){return(n<10?'0':'')+n}return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function uid(){return 'T25-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}

/* =================== RENDER =================== */
function render(){
  var ub=$('#userbar');$('#poster').classList.toggle('compact',st.view==='pair');
  if(st.view==='login'){ub.classList.add('hide');renderLogin();return}
  ub.classList.remove('hide');
  $('#who').textContent=st.name+' · '+st.group;
  $('#goHome').classList.toggle('on',st.view==='home');
  $('#goP1').classList.toggle('on',st.view==='pair'&&st.pair==='p1');
  $('#goP2').classList.toggle('on',st.view==='pair'&&st.pair==='p2');
  if(st.view==='home')renderHome();else renderPair();
}
function renderLogin(){
  app.innerHTML='<div class="h2" style="margin-top:30px"><span class="n">!</span><span>Кто работает</span></div>'+
  '<div class="card"><p>Введите фамилию, имя и группу. Работа сохраняется в этом браузере: если закрыть страницу, ответы не пропадут. В конце каждой пары нажмите «Сдать работу», ответы уйдут преподавателю.</p>'+
  '<label class="f" for="nm">Фамилия и имя</label><input class="t" id="nm" autocomplete="name" value="'+esc(st.name)+'">'+
  '<label class="f" for="gr">Группа</label><input class="t" id="gr" value="'+esc(st.group)+'">'+
  '<div style="margin-top:18px"><button class="btn red" id="go" type="button">Начать</button></div></div>';
  $('#go').onclick=function(){
    var n=$('#nm').value.trim(),g=$('#gr').value.trim();
    if(n.length<3||n.indexOf(' ')<0){toast('Введите фамилию и имя');return}
    if(!g){toast('Введите группу');return}
    st.name=n;st.group=g;if(!st.id)st.id=uid();st.view='home';save();render();scrollTo(0,0);
  };
}
function pairProgress(p){
  if(p==='p1'){var a=0,t=0;DOCS1.forEach(function(d){d.qs.forEach(function(q){t++;if((st.ans[q.id]||'').trim().length>=15)a++})});
    ['dosq1','dosq2','dosq3','introq'].forEach(function(k){t++;if((st.ans[k]||'').trim().length>=15)a++});
    return {done:a+(st.sortChecked?1:0)+(st.t1done?1:0),all:t+2}}
  var b=0,u=0;DOCS2.forEach(function(d){d.qs.forEach(function(q){u++;if((st.ans[q.id]||'').trim().length>=15)b++})});
  ['dos2q1','dos2q2','dos2q3'].forEach(function(k){u++;if((st.ans[k]||'').trim().length>=15)b++});
  return {done:b+Object.keys(st.sim).length+(st.t2done?1:0)+(wc(st.essay)>=150?1:0),all:u+SIM.length+2}
}
function renderHome(){
  var h='<div class="h2"><span class="n">→</span><span>Две пары, один сайт</span></div><p class="lead">Выберите пару, которую проходите сейчас</p><div class="pairs">';
  ['p1','p2'].forEach(function(p,i){var P=PAIRS[p],pr=pairProgress(p);
    h+='<div class="pair"><div class="top"><div class="num">0'+(i+1)+'</div><div class="nm">'+P.title+'</div></div><div class="body">'+
    '<div class="status'+(st.sent[p]?' ok':'')+'">'+(st.sent[p]?'Сдано · '+esc(st.sent[p]):'Выполнено: '+pr.done+' из '+pr.all)+'</div>'+
    '<div class="muted">'+P.span+'</div><ol>'+P.steps.map(function(s){return'<li>'+s.n+'</li>'}).join('')+'</ol>'+
    '<button class="btn'+(i?' red':'')+'" data-p="'+p+'" type="button">Открыть пару '+(i+1)+'</button></div></div>'});
  h+='</div><div class="card"><h3>Как работать</h3><p>Пройдите этапы по порядку: кнопки этапов находятся вверху пары, их можно листать пальцем. Письменные ответы пишите своими словами, 2–4 предложения на вопрос. Тест в конце пары проверяется сразу. После теста откройте этап «Сдать» и отправьте работу.</p></div>';
  app.innerHTML=h;
  $$('[data-p]').forEach(function(b){b.onclick=function(){openPair(b.getAttribute('data-p'),0)}});
}
function openPair(p,step){st.view='pair';st.pair=p;st.step=step||0;if(!st.started[p])st.started[p]=Date.now();save();render();scrollTo(0,0)}
function renderPair(){
  var P=PAIRS[st.pair],s=P.steps[st.step];
  var h='<nav class="steps" aria-label="Этапы">'+P.steps.map(function(x,i){return'<button type="button" data-s="'+i+'" class="'+(i===st.step?'cur':'')+(stepDone(st.pair,x.id)?' done':'')+'"><b>'+(i+1)+'</b>'+x.n+'</button>'}).join('')+'</nav>';
  h+='<div id="stage"></div>';
  h+='<div class="nextbar">'+(st.step>0?'<button class="btn alt" id="prev" type="button">← Назад</button>':'<span></span>')+
     (st.step<P.steps.length-1?'<button class="btn" id="next" type="button">Дальше →</button>':'')+'</div>';
  app.innerHTML=h;
  $$('[data-s]').forEach(function(b){b.onclick=function(){st.step=+b.getAttribute('data-s');save();render();scrollTo(0,0)}});
  var pv=$('#prev'),nx=$('#next');
  if(pv)pv.onclick=function(){st.step--;save();render();scrollTo(0,0)};
  if(nx)nx.onclick=function(){st.step++;save();render();scrollTo(0,0)};
  var cur=$('.steps .cur');if(cur&&cur.scrollIntoView){try{cur.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  var stage=$('#stage');
  var fn={p1:{intro:sIntro,sort:sSort,docs:function(e){sDocs(e,DOCS1,'Документы: 1920–1935','Прочитайте выдержки и ответьте на вопросы под каждым документом.')},dos:sDos1,test:function(e){sTest(e,TEST1,'t1','t1done')},send:sSend},
          p2:{sim:sSim,docs:function(e){sDocs(e,DOCS2,'Документы: 1938–1941','Шесть документов от Женевы до сообщения ТАСС. Секретный протокол приведён полностью.')},dos:sDos2,essay:sEssay,test:function(e){sTest(e,TEST2,'t2','t2done')},send:sSend}};
  fn[st.pair][s.id](stage);
  window.scrollTo&&window.scrollTo(window.scrollX,window.scrollY);
}
function stepDone(p,id){
  if(id==='sort')return st.sortChecked;
  if(id==='test')return p==='p1'?st.t1done:st.t2done;
  if(id==='sim')return Object.keys(st.sim).length===SIM.length;
  if(id==='essay')return wc(st.essay)>=150;
  if(id==='send')return !!st.sent[p];
  if(id==='intro')return (st.ans.introq||'').trim().length>=15;
  if(id==='docs'){var D=p==='p1'?DOCS1:DOCS2;return D.every(function(d){return d.qs.every(function(q){return (st.ans[q.id]||'').trim().length>=15})})}
  if(id==='dos'){var ks=p==='p1'?['dosq1','dosq2','dosq3']:['dos2q1','dos2q2','dos2q3'];return ks.every(function(k){return (st.ans[k]||'').trim().length>=15})}
  return false;
}
function ta(id,q,ph){return '<p class="q">'+q+'</p><textarea class="t" data-a="'+id+'" placeholder="'+(ph||'Ваш ответ')+'">'+esc(st.ans[id]||'')+'</textarea>'}
function bindTA(root){$$('textarea[data-a]',root).forEach(function(t){t.addEventListener('input',function(){st.ans[t.getAttribute('data-a')]=t.value;save()})})}
function head(n,t,l){return '<div class="h2"><span class="n">'+n+'</span><span>'+t+'</span></div>'+(l?'<p class="lead">'+l+'</p>':'')}

/* ---------- pair 1 ---------- */
function sIntro(e){
  e.innerHTML=head('1','Две линии','Коминтерн и Наркоминдел: 1919–1935')+
  '<div class="card"><p>После Гражданской войны у советского руководства было два инструмента внешней политики. Коммунистический интернационал (Коминтерн), созданный в Москве в марте 1919 г., объединял компартии разных стран и готовил революции за пределами России. Народный комиссариат иностранных дел (НКИД) во главе с Г. В. Чичериным (1918–1930), а затем М. М. Литвиновым (1930–1939) вёл переговоры с теми самыми правительствами, свергнуть которые призывал Коминтерн.</p>'+
  '<p>Надежды на революцию в Европе в начале 1920-х гг. не оправдались. Советские республики в Венгрии и Баварии пали в 1919 г., в 1920 г. Красная армия была остановлена под Варшавой, в октябре 1923 г. подавлено восстание коммунистов в Гамбурге. В 1924–1925 гг. И. В. Сталин выдвинул тезис о возможности построить социализм в одной стране; в апреле 1925 г. его одобрила XIV конференция РКП(б). Лозунг мировой революции остался, но на первое место вышли безопасность СССР, торговля и кредиты.</p>'+
  '<p>В 1922 г. Советская Россия прорвала изоляцию: в Рапалло договор с ней подписала Германия. В 1924 г. СССР признали Великобритания, Италия, Франция и другие страны, в 1933 г. США. Отношения оставались хрупкими: в 1927 г. Великобритания разорвала их после обвинений в подрывной деятельности.</p>'+
  '<p>В 1930-е гг. главной угрозой стали Япония, захватившая в 1931 г. Маньчжурию, и Германия, где в январе 1933 г. к власти пришёл Гитлер. НКИД перешёл к политике коллективной безопасности: договоры о ненападении и взаимопомощи, вступление в Лигу Наций в 1934 г., предложения о совместном отпоре агрессору. Коминтерн на VII конгрессе в 1935 г. призвал коммунистов создавать народные фронты вместе с социалистами и либералами против фашизма.</p></div>'+
  '<div class="card red"><h3>Вопрос для разминки</h3><p>Ответьте до начала сортировки и вернитесь к ответу в конце пары, если захотите его изменить.</p></div>'+
  ta('introq','Чем могли мешать друг другу Коминтерн и НКИД? Приведите пример, когда деятельность одного осложняла работу другого.');
  bindTA(e);
}
function sSort(e){
  var h=head('2','Сортировка','Революция или дипломатия?')+
  '<div class="card"><p>Отнесите каждое событие к одной из двух линий. Когда разложите все 12 карточек, нажмите «Проверить». После проверки ответы изменить нельзя.</p></div>'+
  '<div class="cols"><div class="colhead a">Курс на мировую революцию (Коминтерн)</div><div class="colhead b">Государственная дипломатия (НКИД)</div></div>';
  if(st.sortChecked){var sc=sortScore();h+='<div class="scorebox">Верно: '+sc+' из '+SORT.length+'</div>'}
  h+='<div class="sortlist'+(st.sortChecked?' checked':'')+'">';
  SORT.forEach(function(c){var v=st.sort[c.id];var cls=st.sortChecked?(v===c.k?' right':' wrong'):'';
    h+='<div class="scard'+cls+'" data-c="'+c.id+'"><div class="yr">'+c.y+'</div><div class="tx">'+c.t+'</div><div class="ch">'+
    '<button type="button" class="a'+(v==='a'?' sel':'')+'" data-v="a">Революция</button><button type="button" class="b'+(v==='b'?' sel':'')+'" data-v="b">Дипломатия</button></div>'+
    '<div class="ex">'+(st.sortChecked&&v!==c.k?'<b>Правильно: '+(c.k==='a'?'революция':'дипломатия')+'.</b> ':'')+c.e+'</div></div>'});
  h+='</div>';
  if(!st.sortChecked)h+='<div style="margin:20px 0"><button class="btn red" id="chk" type="button">Проверить</button></div>';
  e.innerHTML=h;
  $$('.scard').forEach(function(card){$$('button',card).forEach(function(b){b.onclick=function(){if(st.sortChecked)return;st.sort[card.getAttribute('data-c')]=b.getAttribute('data-v');save();
    $$('button',card).forEach(function(x){x.classList.toggle('sel',x===b)})}})});
  var c=$('#chk');if(c)c.onclick=function(){var n=SORT.filter(function(x){return st.sort[x.id]}).length;
    if(n<SORT.length){toast('Разложены не все карточки: '+n+' из '+SORT.length);return}
    st.sortChecked=true;save();render();};
}
function sortScore(){return SORT.filter(function(x){return st.sort[x.id]===x.k}).length}
function sDocs(e,D,t,l){
  var num=st.pair==='p1'?'3':'2';
  var h=head(num,t,l);
  D.forEach(function(d,i){
    h+='<article class="doc"><div class="stamp">'+d.stamp+'</div><div class="dh">'+(st.pair==='p1'?'Д'+(i+1):'Д'+(i+4))+'. '+d.title+'</div><p class="meta">'+d.meta+'</p>'+
    '<div class="ctx">'+d.ctx+'</div>'+d.text.map(function(p){return'<p>'+p+'</p>'}).join('')+'</article>'+
    '<div class="docq">'+d.qs.map(function(q){return ta(q.id,q.q)}).join('')+'</div>'});
  e.innerHTML=h;bindTA(e);
}
function dosHTML(D,two){return '<div class="dgrid'+(two?' two':'')+'">'+D.map(function(d){return'<section class="dos"><div class="dt">'+d.t+'<small>'+d.y+'</small></div><dl>'+d.rows.map(function(r){return'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join('')+'</dl></section>'}).join('')+'</div>'}
function sDos1(e){
  e.innerHTML=head('4','Досье','Советские добровольцы и первый бой с Японией')+
  '<div class="card"><p>Три карточки о том, как СССР действовал за пределами своих границ в 1936–1938 гг. Прочитайте их и ответьте на вопросы под карточками.</p></div>'+dosHTML(DOS1)+
  '<div class="docq">'+ta('dosq1','Сравните формы участия СССР в Испании, в Китае и у озера Хасан. Где СССР действовал открыто, а где скрывал своё участие? Почему?')+
  ta('dosq2','Почему СССР помогал Чан Кайши, а не только китайским коммунистам? Какая из двух линий (революция или дипломатия) здесь победила?')+
  ta('dosq3','Какие уроки для армии и политики можно было извлечь из Испании и Хасана? Учтите судьбу командиров.')+'</div>';
  bindTA(e);
}
function sTest(e,T,key,dk){
  var locked=st[dk];
  var h=head(st.pair==='p1'?'5':'5','Тест',T.length+' вопросов, один верный ответ')+'<div class="card"><p>Ответьте на все вопросы и нажмите «Проверить тест». После проверки ответы изменить нельзя.</p></div>';
  if(locked){h+='<div class="scorebox">Верно: '+testScore(T,st[key])+' из '+T.length+'</div>'}
  T.forEach(function(q,i){var a=st[key][i];
    h+='<div class="qz'+(locked?' locked':'')+'"><p class="qt">'+(i+1)+'. '+q.q+'</p>'+q.o.map(function(o,j){var cls='';if(locked){if(j===q.k)cls=' good';else if(a===j)cls=' bad'}
      return'<label class="opt'+cls+'"><input type="radio" name="'+key+i+'" value="'+j+'"'+(a===j?' checked':'')+(locked?' disabled':'')+'><span>'+o+'</span></label>'}).join('')+'</div>'});
  if(!locked)h+='<div style="margin:20px 0"><button class="btn red" id="tchk" type="button">Проверить тест</button></div>';
  else h+='<div style="margin:20px 0"><button class="btn" id="tosend" type="button">Перейти к сдаче →</button></div>';
  e.innerHTML=h;
  $$('input[type=radio]',e).forEach(function(r){r.onchange=function(){var i=+r.name.replace(key,'');st[key][i]=+r.value;save()}});
  var c=$('#tchk');if(c)c.onclick=function(){var n=Object.keys(st[key]).length;if(n<T.length){toast('Отвечено '+n+' из '+T.length);return}st[dk]=true;save();render();window.scrollTo(0,0)};
  var g=$('#tosend');if(g)g.onclick=function(){st.step=PAIRS[st.pair].steps.length-1;save();render();scrollTo(0,0)};
}
function testScore(T,a){return T.filter(function(q,i){return a[i]===q.k}).length}

/* ---------- pair 2 ---------- */
function sSim(e){
  var i=0;while(i<SIM.length&&st.sim[i]!=null)i++;
  var view=st.simView!=null?st.simView:Math.min(i,SIM.length-1);
  if(view>i)view=i;
  var x=SIM[view],chosen=st.sim[view];
  var matches=Object.keys(st.sim).filter(function(k){return st.sim[k]===SIM[k].r}).length;
  var h=head('1','Выбор наркома','Девять развилок 1938–1941 гг.')+
  '<div class="card"><p>Вы руководите внешней политикой СССР. На каждом шаге выберите решение и коротко объясните его. После выбора откроется, как поступило советское руководство и что из этого вышло. Здесь нет оценки «правильно» или «неправильно»: сравнивайте свои решения с реальными.</p></div>'+
  '<div class="sim"><div class="sh"><span>Развилка '+(view+1)+' из '+SIM.length+'</span><span>Совпадений: '+matches+'</span></div>'+
  '<div class="prog"><i style="width:'+(Object.keys(st.sim).length/SIM.length*100)+'%"></i></div><div class="sb">'+
  '<div class="date">'+x.d+'</div><p class="sit">'+x.s+'</p>';
  if(chosen==null){
    h+='<label class="f" for="why" style="color:var(--paper)">Сначала коротко объясните, чем будете руководствоваться</label><textarea class="t" id="why" placeholder="Например: главная угроза сейчас…">'+esc(st.simWhy[view]||'')+'</textarea>'+
       '<div class="ops" style="margin-top:12px">'+x.o.map(function(o,j){return'<button type="button" data-o="'+j+'"><b>'+'АБВ'[j]+'</b><span>'+o+'</span></button>'}).join('')+'</div>';
  }else{
    h+='<div class="ops">'+x.o.map(function(o,j){return'<button type="button" disabled class="'+(j===chosen?'sel ':'')+(j===x.r?'real':'')+'"><b>'+'АБВ'[j]+'</b><span>'+o+(j===x.r?' <i>(реальное решение)</i>':'')+'</span></button>'}).join('')+'</div>'+
       '<div class="fact"><h4>'+(chosen===x.r?'Вы совпали с реальным решением':'В действительности выбрали вариант '+'АБВ'[x.r])+'</h4><p>'+x.f+'</p></div>'+
       (st.simWhy[view]?'<p class="muted" style="color:#cfc5b0">Ваше объяснение: '+esc(st.simWhy[view])+'</p>':'');
  }
  h+='<div class="row" style="margin-top:14px;justify-content:space-between">'+
     (view>0?'<button class="btn alt" id="sprev" type="button">← Развилка '+view+'</button>':'<span></span>')+
     (chosen!=null&&view<SIM.length-1?'<button class="btn red" id="snext" type="button">Развилка '+(view+2)+' →</button>':'')+'</div></div></div>';
  if(Object.keys(st.sim).length===SIM.length){
    h+='<div class="card red"><h3>Итог: '+matches+' совпадений из '+SIM.length+'</h3><p>Ответьте на вопрос ниже, затем переходите к документам.</p></div>'+
    ta('simq','Где ваши решения разошлись с реальными? Какие сведения были у руководства СССР, которых не было у вас, и наоборот?');
  }
  e.innerHTML=h;bindTA(e);
  var w=$('#why');if(w)w.oninput=function(){st.simWhy[view]=w.value;save()};
  $$('[data-o]',e).forEach(function(b){b.onclick=function(){var why=(st.simWhy[view]||'').trim();if(why.length<15){toast('Сначала объясните решение (хотя бы одно предложение)');if(w)w.focus();return}
    st.sim[view]=+b.getAttribute('data-o');st.simView=view;save();render();var s=$('.sim');if(s)s.scrollIntoView({block:'start'})}});
  var sp=$('#sprev'),sn=$('#snext');
  if(sp)sp.onclick=function(){st.simView=view-1;save();render();$('.sim').scrollIntoView({block:'start'})};
  if(sn)sn.onclick=function(){st.simView=view+1;save();render();$('.sim').scrollIntoView({block:'start'})};
}
function sDos2(e){
  e.innerHTML=head('3','Досье','Две войны и новые границы')+dosHTML(DOS2,true)+
  '<div class="h2" style="font-size:28px"><span>Новые территории 1939–1940</span></div><ul class="tl">'+TL.map(function(t){return'<li><span class="d">'+t[0]+'</span>'+t[1]+'</li>'}).join('')+'</ul>'+
  '<div class="docq">'+ta('dos2q1','Сравните Халхин-Гол и Зимнюю войну: цели СССР, противник, потери, международные последствия.')+
  ta('dos2q2','Какие выводы о Красной армии могли сделать в Берлине и в Токио по итогам 1939–1940 гг.?')+
  ta('dos2q3','Какие из изменений границ 1939–1940 гг. прямо следуют из секретного протокола 23 августа 1939 г.?')+'</div>';
  bindTA(e);
}
function wc(s){return (String(s||'').trim().match(/[A-Za-zА-Яа-яЁё0-9-]+/g)||[]).length}
function sEssay(e){
  e.innerHTML=head('4','Эссе','Был ли у СССР выбор в августе 1939 года?')+
  '<div class="card"><p>Историки до сих пор спорят, чем был договор 23 августа 1939 г. Ниже две основные позиции. Прочитайте их и напишите эссе от 150 до 300 слов.</p></div>'+
  '<div class="pos"><div class="card"><span class="tag r">Позиция 1</span><h3>Вынужденный шаг</h3><p>После Мюнхена СССР не доверял Англии и Франции. Военные миссии приехали в Москву без полномочий, Польша не пропускала Красную армию. На Халхин-Голе в это время шли бои с Японией, и в Москве опасались войны на два фронта. Договор отодвинул войну почти на два года и сдвинул границу на запад. Так оценивала события советская историография (брошюра «Фальсификаторы истории», 1948); близкие выводы делает британский историк Дж. Робертс.</p></div>'+
  '<div class="card"><span class="tag">Позиция 2</span><h3>Расчёт и раздел сфер</h3><p>Секретный протокол показывает, что Москва договорилась о территориях: восточная Польша, Прибалтика, Бессарабия отходили к советской сфере интересов. Сталин рассчитывал, что Германия, Англия и Франция истощат друг друга в долгой войне. Ставка не сработала: Франция пала за шесть недель, Германия получила по торговым соглашениям советское сырьё. Такую позицию развивают, например, российские историки С. З. Случ и М. И. Мельтюхов.</p></div></div>'+
  '<div class="card"><h3>Что должно быть в эссе</h3><ol><li>Ваш ответ на вопрос в первом предложении.</li><li>Не меньше трёх фактов из документов и досье этой пары (даты, статьи договоров, события).</li><li>Разбор хотя бы одного довода противоположной позиции.</li><li>Вывод: что выиграл и что потерял СССР к 22 июня 1941 г.</li></ol></div>'+
  '<textarea class="t" id="essay" style="min-height:280px" placeholder="Ваше эссе">'+esc(st.essay)+'</textarea><div class="cnt" id="ec"></div>';
  var t=$('#essay'),c=$('#ec');function upd(){var n=wc(t.value);c.textContent='Слов: '+n+(n<150?' · нужно не меньше 150':n>300?' · больше 300, сократите':' · объём подходит');c.style.color=n<150||n>300?'var(--red)':'var(--ok)'}
  t.oninput=function(){st.essay=t.value;save();upd()};upd();
}

/* ---------- send ---------- */
function missingList(p){
  var m=[];
  if(p==='p1'){if(!stepDone('p1','intro'))m.push('Вопрос на этапе «Две линии»');if(!st.sortChecked)m.push('Сортировка не проверена');
    DOCS1.forEach(function(d,i){d.qs.forEach(function(q,j){if((st.ans[q.id]||'').trim().length<15)m.push('Д'+(i+1)+', вопрос '+(j+1))})});
    ['dosq1','dosq2','dosq3'].forEach(function(k,i){if((st.ans[k]||'').trim().length<15)m.push('Досье, вопрос '+(i+1))});
    if(!st.t1done)m.push('Тест не проверен');}
  else{var n=Object.keys(st.sim).length;if(n<SIM.length)m.push('Выбор наркома: пройдено '+n+' из '+SIM.length);
    DOCS2.forEach(function(d,i){d.qs.forEach(function(q,j){if((st.ans[q.id]||'').trim().length<15)m.push('Д'+(i+4)+', вопрос '+(j+1))})});
    ['dos2q1','dos2q2','dos2q3'].forEach(function(k,i){if((st.ans[k]||'').trim().length<15)m.push('Досье, вопрос '+(i+1))});
    if(wc(st.essay)<150)m.push('Эссе: '+wc(st.essay)+' слов из 150');if(!st.t2done)m.push('Тест не проверен');}
  return m;
}
function sSend(e){
  var p=st.pair,m=missingList(p);
  var h=head('6','Сдать работу',PAIRS[p].title);
  if(st.sent[p])h+='<div class="card red"><h3>Работа отправлена</h3><p>Отправлено: '+esc(st.sent[p])+'. Если вы что-то исправили, можно отправить ещё раз: преподаватель увидит последнюю версию.</p></div>';
  h+='<div class="card"><p><b>'+esc(st.name)+'</b>, группа '+esc(st.group)+'</p>'+
   (p==='p1'?'<p>Сортировка: '+(st.sortChecked?sortScore()+' из '+SORT.length:'не проверена')+'<br>Тест: '+(st.t1done?testScore(TEST1,st.t1)+' из '+TEST1.length:'не проверен')+'</p>'
            :'<p>Совпадений с реальными решениями: '+Object.keys(st.sim).filter(function(k){return st.sim[k]===SIM[k].r}).length+' из '+SIM.length+'<br>Эссе: '+wc(st.essay)+' слов<br>Тест: '+(st.t2done?testScore(TEST2,st.t2)+' из '+TEST2.length:'не проверен')+'</p>')+
   (m.length?'<div class="missing"><b>Не выполнено:</b><ul>'+m.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul></div><p class="muted">Отправить можно и сейчас, но незаполненные ответы уйдут пустыми.</p>':'<p class="status ok">Все задания выполнены</p>')+
   '<button class="btn red" id="snd" type="button">'+(st.sent[p]?'Отправить ещё раз':'Сдать работу')+'</button></div>';
  e.innerHTML=h;
  $('#snd').onclick=function(){var b=this;if(m.length&&!confirm('Есть невыполненные задания ('+m.length+'). Всё равно отправить?'))return;b.disabled=true;b.textContent='Отправка…';
    send(p,function(ok,msg){if(ok){st.sent[p]=fmt(Date.now());save();toast('Работа отправлена');render()}else{b.disabled=false;b.textContent='Повторить отправку';toast('Не отправлено: '+(msg||'ошибка')+'. Проверьте интернет')}})};
}
function answersText(p){
  var L=[];function A(k){return (st.ans[k]||'').trim()||'—'}
  if(p==='p1'){L.push('[Разминка] '+A('introq'));
    L.push('[Сортировка] '+SORT.map(function(c,i){return (i+1)+':'+(st.sort[c.id]===c.k?'+':'−')}).join(' '));
    DOCS1.forEach(function(d,i){d.qs.forEach(function(q,j){L.push('[Д'+(i+1)+'.'+(j+1)+'] '+A(q.id))})});
    ['dosq1','dosq2','dosq3'].forEach(function(k,i){L.push('[Досье '+(i+1)+'] '+A(k))});
    L.push('[Тест] '+TEST1.map(function(q,i){return (i+1)+':'+(st.t1[i]===q.k?'+':'−')}).join(' '));}
  else{SIM.forEach(function(x,i){var c=st.sim[i];L.push('[Нарком '+(i+1)+' · '+x.d+'] выбор '+(c==null?'—':'АБВ'[c]+(c===x.r?' (совпал)':' (реально '+'АБВ'[x.r]+')'))+'; объяснение: '+((st.simWhy[i]||'').trim()||'—'))});
    L.push('[Нарком итог] '+A('simq'));
    DOCS2.forEach(function(d,i){d.qs.forEach(function(q,j){L.push('[Д'+(i+4)+'.'+(j+1)+'] '+A(q.id))})});
    ['dos2q1','dos2q2','dos2q3'].forEach(function(k,i){L.push('[Досье '+(i+1)+'] '+A(k))});
    L.push('[Эссе, '+wc(st.essay)+' сл.] '+(st.essay.trim()||'—'));
    L.push('[Тест] '+TEST2.map(function(q,i){return (i+1)+':'+(st.t2[i]===q.k?'+':'−')}).join(' '));}
  return L.join('\n');
}
function payload(p){
  var score,max,scores;
  if(p==='p1'){var a=sortScore(),b=st.t1done?testScore(TEST1,st.t1):0;score=a+b;max=SORT.length+TEST1.length;scores='сортировка '+a+'/'+SORT.length+'; тест '+b+'/'+TEST1.length}
  else{var m=Object.keys(st.sim).filter(function(k){return st.sim[k]===SIM[k].r}).length,t=st.t2done?testScore(TEST2,st.t2):0;score=t;max=TEST2.length;scores='тест '+t+'/'+TEST2.length+'; совпадений с реальными решениями '+m+'/'+SIM.length+'; эссе '+wc(st.essay)+' слов'}
  var now=Date.now(),started=st.started[p]||now;
  return JSON.stringify({sheet:PAIRS[p].sheet,id:st.id+'-'+p,name:st.name,group:st.group,status:missingList(p).length?'неполная':'завершён',
    started:fmt(started),ended:fmt(now),score:score,max:max,percent:Math.round(score/max*100),duration:Math.round((now-started)/1000),
    leaves:0,awaySec:0,leaveLog:'',blocked:0,blockLog:'',timeouts:0,timeoutQ:'',reloads:0,
    ua:navigator.userAgent,screen:(screen.width||0)+'x'+(screen.height||0),scores:scores,answers:answersText(p)});
}
function send(p,cb){
  var body=payload(p);
  var ctl=('AbortController' in window)?new AbortController():null;var tm=setTimeout(function(){if(ctl)ctl.abort()},15000);
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:body,redirect:'follow',signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()}).then(function(j){clearTimeout(tm);if(j&&j.ok)cb(true);else cb(false,'таблица ответила ошибкой')})
  .catch(function(){clearTimeout(tm);fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:body}).then(function(){cb(true)}).catch(function(){cb(false,'нет связи')})});
}

/* ---------- nav ---------- */
$('#goHome').onclick=function(){st.view='home';save();render();scrollTo(0,0)};
$('#goP1').onclick=function(){openPair('p1',st.pair==='p1'?st.step:0)};
$('#goP2').onclick=function(){openPair('p2',st.pair==='p2'?st.step:0)};
if(st.view!=='login'&&!st.name)st.view='login';
render();
})();
</script>
